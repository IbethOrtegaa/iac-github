name: Deploy EC2

# este on es como el encendido, es como un disparo manual para encender el deploy
on:
  workflow_dispatch:

#los jobs son las tareas que el workflow va a ejecutar
jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
#valida que existan las claves de acceso
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
#en clodformation se hace el despliegue 
      - name: Deploy CloudFormation Stack
        run: |
          aws cloudformation deploy \
          --template-file templates/ec2.yaml \
          --stack-name ec2-stack-clase